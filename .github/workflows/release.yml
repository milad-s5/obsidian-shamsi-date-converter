name: Release Obsidian Plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build project
        run: npm run build

      - name: Verify tag format and manifest version
        run: |
          TAG_VERSION=${{ steps.version.outputs.VERSION }}
          if [[ "$TAG_VERSION" != v* ]]; then
            echo "❌ Tag '$TAG_VERSION' must start with 'v' (e.g., v1.1.0)"
            exit 1
          fi
          MANIFEST_VERSION=$(jq -r '.version' manifest.json)
          STRIPPED_TAG_VERSION=${TAG_VERSION#v}
          if [ "$MANIFEST_VERSION" != "$STRIPPED_TAG_VERSION" ]; then
            echo "❌ manifest.json version ($MANIFEST_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          echo "✅ Version match: $MANIFEST_VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: ${{ steps.version.outputs.VERSION }}
          files: |
            dist/main.js
            manifest.json
            styles.css
          generate_release_notes: true